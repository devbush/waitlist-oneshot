<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}} — Waitlist</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="glow"></div><div class="grain"></div>
  <div class="container">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h6"/></svg></span>
        Waitlist
      </a>
    </header>
  </div>
  <main class="auth-main">
    <div class="card auth-card">
      <h1>{{heading}}</h1>
      <p class="sub">{{sub}}</p>
      <form id="auth-form" data-mode="{{mode}}" data-next="{{next}}" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" placeholder="vous@exemple.com" required autofocus>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="password-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="{{autocomplete}}" maxlength="200" required>
            <button class="reveal" type="button" id="reveal" aria-label="Afficher le mot de passe" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          {{passwordHint}}
        </div>
        <div id="auth-error" class="alert alert-error hidden" role="alert"></div>
        <button class="btn btn-primary" type="submit">{{submit}}</button>
      </form>
      <p class="auth-switch">{{switchText}} <a href="{{switchHref}}">{{switchLabel}}</a></p>
    </div>
  </main>
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
</body>
</html>
